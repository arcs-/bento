<bento-group class="lunch-box">
  <bento-panel
    id="onigiri"
    class="dish food-onigiri"
    size="26%"
    min="130px"
    collapsible
    collapsed-size="44px"
  >
    <div class="compartment">
      <strong>Onigiri</strong>
      <code data-demo-only>collapsed-size="44px"</code>
      <span data-live-width></span>
    </div>
  </bento-panel>
  <bento-separator aria-label="Resize onigiri" aria-controls="onigiri"></bento-separator>
  <bento-panel id="rice" class="dish food-rice">
    <div class="compartment">
      <span class="food-rice-plum"></span>
      <strong>Rice</strong>
      <span data-live-width></span>
    </div>
  </bento-panel>
  <bento-separator aria-label="Resize side dishes" aria-controls="sides"></bento-separator>
  <bento-panel
    id="sides"
    class="duration-500 ease-out"
    size="30%"
    min="150px"
    collapsible
    modal="(max-width: 560px)"
    aria-label="Side dishes"
  >
    <bento-group orientation="vertical">
      <bento-panel id="tamagoyaki" class="dish food-tamagoyaki">
        <div class="compartment">
          <strong>Tamagoyaki</strong>
          <span data-live-width></span>
        </div>
      </bento-panel>
      <bento-separator aria-label="Resize pickles" aria-controls="pickles"></bento-separator>
      <bento-panel id="pickles" class="dish food-pickles" size="40%" min="56px" collapsible>
        <div class="compartment"><strong>Pickles</strong></div>
      </bento-panel>
    </bento-group>
  </bento-panel>
</bento-group>
<div class="specimen-controls" data-demo-only>
  <button class="satin-button" type="button" data-toggle-panel="sides" aria-controls="sides">
    Side dishes
  </button>
</div>
