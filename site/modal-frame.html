<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Modal panel demo = bento</title>
    <script src="{{bentoScript}}" vite-ignore></script>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="stylesheet" href="/styles/site.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="frame-page">
    <!-- live -->
    <bento-group>
      <bento-panel
        id="filters"
        size="200px"
        min="160px"
        collapsible
        modal="(max-width: 480px)"
        aria-label="Filters"
      >
        <div class="demo-content">
          <h2>Filters</h2>
          <fieldset class="filter-list">
            <legend>Material</legend>
            <label><input type="checkbox" checked /> Stainless steel</label>
            <label><input type="checkbox" /> Aluminium</label>
            <label><input type="checkbox" /> Lacquered wood</label>
          </fieldset>
          <button class="satin-button drawer-close" type="button" data-close-panel="filters">
            Close
          </button>
        </div>
      </bento-panel>
      <bento-separator aria-label="Resize filters" aria-controls="filters"></bento-separator>
      <bento-panel>
        <div class="demo-content">
          <button
            class="satin-button open-drawer"
            type="button"
            data-toggle-panel="filters"
            aria-controls="filters"
          >
            Open filters
          </button>
          <h2>Lunch boxes</h2>
          <ul class="product-list">
            <li>Two-tier stainless box</li>
            <li>Brushed aluminium tin</li>
            <li>Single compartment, milled lid</li>
          </ul>
        </div>
      </bento-panel>
    </bento-group>
    <!-- /live -->
  </body>
</html>
