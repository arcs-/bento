<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    {{seoHead}}
    <script src="{{bentoScript}}" vite-ignore></script>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="stylesheet" href="/styles/site.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <bento-group class="box" orientation="vertical">
      <bento-panel id="titlebar" class="titlebar" size="52px">
        <header class="titlebar-plate">
          <a class="wordmark" href="index.html" aria-label="bento, home">
            <img class="wordmark-mark" src="/icon.png" alt="" width="28" height="28" />
            <span>bento</span>
          </a>
          <div class="titlebar-controls">
            <button
              class="satin-button"
              type="button"
              data-toggle-panel="contents"
              aria-controls="contents"
            >
              Contents
            </button>
            <button
              class="satin-button"
              type="button"
              data-toggle-panel="inspector"
              aria-controls="inspector"
            >
              Inspector
            </button>
            <a class="satin-button" href="https://github.com/arcs-/bento">
              <svg class="button-mark" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"
                />
              </svg>
              <span class="narrow-hidden">GitHub</span>
            </a>
          </div>
        </header>
      </bento-panel>
      <bento-panel class="workspace">
        <bento-group class="shell-group layout">
          <bento-panel
            id="contents"
            class="drawer tray-panel"
            size="248px"
            min="200px"
            max="45%"
            collapsible
            collapsed-size="56px"
            modal="(max-width: 720px)"
            aria-label="Contents"
          >
            <div class="tray tray-nav">
              {{navigation}}
              <button class="satin-button drawer-close" type="button" data-close-panel="contents">
                Close
              </button>
            </div>
          </bento-panel>
          <bento-separator
            aria-label="Resize contents"
            aria-controls="contents"
            tabindex="0"
          ></bento-separator>
          <bento-panel id="page-panel" class="page-panel tray-panel" min="30%">
            <main id="content" class="tray tray-page" tabindex="-1">
              <article class="prose">{{content}}</article>
            </main>
          </bento-panel>
          <bento-separator
            aria-label="Resize inspector"
            aria-controls="inspector"
            tabindex="0"
          ></bento-separator>
          <bento-panel
            id="inspector"
            class="drawer"
            size="320px"
            min="240px"
            max="45%"
            collapsible{{inspectorCollapsed}}
            modal="(max-width: 1100px)"
            aria-label="Inspector"
          >
            <bento-group class="shell-group inspector-stack" orientation="vertical">
              <bento-panel id="panel-pane" class="tray-panel" min="160px">
                <section
                  class="tray tray-inspector"
                  aria-labelledby="panel-inspector-title"
                  data-panel-inspector
                >
                  <div class="inspector-head">
                    <h2 id="panel-inspector-title" data-inspected-name>Panel</h2>
                    <button
                      class="satin-button drawer-close"
                      type="button"
                      data-close-panel="inspector"
                    >
                      Close
                    </button>
                  </div>
                  <p class="inspector-hint" data-inspector-hint>Click, focus or hover a panel.</p>
                  <div class="inspector-body" data-inspector-body></div>
                </section>
              </bento-panel>
              <bento-separator
                aria-label="Resize event log"
                aria-controls="log-pane"
                tabindex="0"
              ></bento-separator>
              <bento-panel
                id="log-pane"
                class="tray-panel"
                size="30%"
                min="140px"
                collapsible
                collapsed-size="52px"
              >
                <section class="tray tray-inspector" aria-labelledby="inspector-title">
                  <div class="inspector-head">
                    <h2 id="inspector-title">Event log</h2>
                    <button class="satin-button" type="button" data-clear-log="page-log">
                      Clear
                    </button>
                  </div>
                  <ol id="page-log" class="event-log" data-event-log="document"></ol>
                </section>
              </bento-panel>
            </bento-group>
          </bento-panel>
        </bento-group>
      </bento-panel>
      <bento-panel id="statusbar" class="statusbar" size="28px">
        <footer class="statusbar-row">
          <output class="status-cell" data-status-of="contents">Contents</output>
          <output class="status-cell status-cell-wide" data-status-of="page-panel">Page</output>
          <output class="status-cell" data-status-of="inspector">Inspector</output>
          <span class="status-cell status-cell-end">MIT licensed</span>
          <a class="status-link" href="https://stillh.art" rel="author">stillh.art</a>
        </footer>
      </bento-panel>
    </bento-group>
  </body>
</html>
